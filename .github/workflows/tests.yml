
name: tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
          ubuntu-latest,
          windows-latest,
          macOS-latest,
        ]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }} install and test
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        if: runner.os == 'Linux'
        # `apt-get` waits forever if another process on the runner holds the
        # dpkg lock, so bound that wait and answer its prompts non-interactively.
        run: >-
          sudo apt-get install -y -o DPkg::Lock::Timeout=300
          texlive-publishers texlive-science cm-super latexmk
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install -e .[test]
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov
          pytest --cov=. --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
